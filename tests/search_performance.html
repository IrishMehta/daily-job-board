<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Search performance benchmark</title></head>
<body>
  <h1>Browser search performance benchmark</h1>
  <pre id="results">Loading current board…</pre>
  <script type="module">
    import { SearchIndex } from "../docs/search.js";
    import { countFacetValues, normalizeText } from "../docs/matching.js";

    const [config, payload] = await Promise.all([
      fetch("../docs/search-config.json").then((response) => response.json()),
      fetch("../docs/data/public_jobs.json").then((response) => response.json()),
    ]);
    const documents = payload.jobs.map((job) => {
      const taxonomy = (job.classification_paths ?? []).flatMap((path) => [
        path.domain, ...(path.specializations ?? []), path.industry,
      ]).filter(Boolean).map((value) => value.replaceAll("_", " "));
      return {
        id: job.id,
        posted_on: job.posted_on,
        fields: {
          title: job.title, match_terms: job.match_terms, taxonomy, company: job.company,
          location: [job.location, ...(job.location_profile?.search_terms ?? [])],
          experience: job.experience_display,
          authorization: [job.work_authorization_display, job.authorization_category_label, job.sponsorship_status],
          summary: job.summary, excerpt: job.description_excerpt,
        },
        suggestions: [
          { category: "Role", label: job.title }, { category: "Company", label: job.company },
          { category: "Location", label: job.location },
          ...(job.match_terms ?? []).map((label) => ({ category: "Skill", label })),
          ...taxonomy.map((label) => ({ category: "Focus", label })),
        ],
      };
    });
    const buildStarted = performance.now();
    const index = new SearchIndex(documents, config);
    const buildMs = performance.now() - buildStarted;
    const queries = ["software engineer", "machine learning", "softwre engineer", "C++", ".NET", "SRE", "data analyst"];
    const timings = queries.map((query) => {
      const started = performance.now();
      const result = index.search(query);
      return { query, elapsed: performance.now() - started, matches: result.matches.length };
    });
    const maximum = Math.max(...timings.map((timing) => timing.elapsed));
    const facetJobs = payload.jobs.map((job) => {
      const paths = job.classification_paths ?? [];
      return {
        ...job,
        _domains: [...new Set(paths.map((path) => path.domain).filter(Boolean))],
        _specializations: [...new Set(paths.flatMap((path) => path.specializations ?? []).filter(Boolean))],
        _industries: [...new Set(paths.map((path) => path.industry).filter(Boolean))],
        _locationSearch: normalizeText([job.location, ...(job.location_profile?.search_terms ?? [])].join(" ")),
        _searchText: "",
      };
    });
    const facetFilters = {
      query: "", domains: ["software_engineering"], specializations: [], industries: [], location: "",
      careerBuckets: [], authorizationCategories: [], sponsorshipStatuses: [], experienceYears: "", postedRange: "7d",
    };
    const facetDefinitions = [
      [(job) => job._domains, ["domains", "specializations"]],
      [(job) => job._specializations, ["specializations"]],
      [(job) => job._industries, ["industries"]],
      [(job) => job.career_bucket, ["careerBuckets"]],
      [(job) => job.authorization_category, ["authorizationCategories"]],
      [(job) => job.sponsorship_status, ["sponsorshipStatuses"]],
    ];
    const facetStarted = performance.now();
    facetDefinitions.forEach(([selector, ignoreFilters]) => {
      countFacetValues(facetJobs, facetFilters, selector, { ignoreFilters });
    });
    const facetMs = performance.now() - facetStarted;
    const lines = [
      `${documents.length.toLocaleString()} jobs indexed in ${buildMs.toFixed(1)} ms`,
      "",
      ...timings.map((timing) => `${timing.elapsed.toFixed(1).padStart(7)} ms  ${String(timing.matches).padStart(5)} matches  ${timing.query}`),
      "",
      `Maximum query time: ${maximum.toFixed(1)} ms`,
      `All contextual facets: ${facetMs.toFixed(1)} ms`,
    ];
    const passed = maximum <= 100 && facetMs <= 100;
    document.title = `${passed ? "PASS" : "FAIL"} — Search performance`;
    document.getElementById("results").textContent = `${lines.join("\n")}\n\n${passed ? "PASS" : "FAIL"}: 100 ms query and facet budgets.`;
    document.body.dataset.result = passed ? "pass" : "fail";
    if (!passed) throw new Error(`Browser budget exceeded: query ${maximum.toFixed(1)} ms; facets ${facetMs.toFixed(1)} ms`);
  </script>
</body>
</html>
